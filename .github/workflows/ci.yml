name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  NODE_VERSION: '22'

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm run lint
        working-directory: backend
      - run: npm run lint
        working-directory: frontend
      - run: npm run format
        working-directory: backend
      - run: npm run format
        working-directory: frontend

  backend-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: mhpt_test
          POSTGRES_PASSWORD: mhpt_test
          POSTGRES_DB: mhpt_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U mhpt_test -d mhpt_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://mhpt_test:mhpt_test@localhost:5433/mhpt_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      # Migrations run inside the test suite itself (tests/setup.ts), no separate step needed.
      - run: npm run test:coverage
        working-directory: backend

  frontend-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run test:coverage
        working-directory: frontend

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      # `moderate` findings are tracked and accepted (see docs/architecture.md) — only fail CI
      # on something new and worse.
      - run: npm audit --audit-level=high
        working-directory: backend
      # react-router's one `high` finding (GHSA-qwww-vcr4-c8h2) is a deliberately accepted
      # exception, not an oversight: it's an RSC-mode CSRF bypass and this app never uses RSC
      # mode, and no fixed version is published upstream yet (see docs/architecture.md). Don't
      # let a stale-but-known finding permanently block every PR — still runs, still visible in
      # the log, just doesn't fail the job. Remove continue-on-error once a real fix ships.
      - run: npm audit --audit-level=high
        working-directory: frontend
        continue-on-error: true

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # No real secrets needed — OAuth is bypassed in E2E, see auth.controller.ts#testLogin.
      - name: Write a throwaway .env for the compose stack
        run: |
          cat > .env <<'EOF'
          POSTGRES_USER=mhpt
          POSTGRES_PASSWORD=ci-only-password
          POSTGRES_DB=mhpt
          POSTGRES_PORT=5432
          DATABASE_URL=postgresql://mhpt:ci-only-password@postgres:5432/mhpt
          PORT=3000
          NODE_ENV=test
          LOG_LEVEL=warn
          JWT_SECRET=ci-only-jwt-secret-not-for-real-use-00000000
          GOOGLE_CLIENT_ID=ci-placeholder
          GOOGLE_CLIENT_SECRET=ci-placeholder
          GOOGLE_REDIRECT_URI=http://localhost:3000/api/auth/google/callback
          FRONTEND_URL=http://localhost:5173
          VITE_API_URL=http://localhost:3000
          EOF
      - name: Start the stack (dev compose + e2e override → NODE_ENV=test)
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci
        working-directory: e2e
      - run: npx playwright install --with-deps chromium
        working-directory: e2e
      - run: npm test
        working-directory: e2e
      - name: Show backend logs on failure
        if: failure()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml logs backend
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 7
      - name: Tear down
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  build-prod-images:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend production image
        run: docker build -f backend/Dockerfile.prod -t mhpt-backend:ci .
      - name: Build frontend production image
        run: docker build -f frontend/Dockerfile.prod -t mhpt-frontend:ci .
      - name: Smoke-check the backend image starts and reports healthy
        run: |
          docker run -d --name mhpt-backend-smoke \
            -e NODE_ENV=production -e PORT=3000 \
            -e DATABASE_URL=postgresql://invalid:invalid@localhost:5432/invalid \
            -e JWT_SECRET=smoke-test-jwt-secret-not-for-real-use \
            -e GOOGLE_CLIENT_ID=x -e GOOGLE_CLIENT_SECRET=x \
            -e GOOGLE_REDIRECT_URI=http://localhost:3000/api/auth/google/callback \
            -e FRONTEND_URL=http://localhost:5173 \
            mhpt-backend:ci
          # No real Postgres here — this only proves the image builds, starts as non-root,
          # and fails the way we expect (retrying a bad DB connection) rather than crashing on
          # a missing dependency or bad CMD. Full behavior against a real DB is what the
          # e2e job already covers.
          sleep 3
          docker exec mhpt-backend-smoke whoami | grep -qx node
          docker logs mhpt-backend-smoke
          docker rm -f mhpt-backend-smoke
