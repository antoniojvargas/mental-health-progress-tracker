services:
  postgres-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: mhpt_test
      POSTGRES_PASSWORD: mhpt_test
      POSTGRES_DB: mhpt_test
    ports:
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U mhpt_test -d mhpt_test']
      interval: 5s
      timeout: 5s
      retries: 10
    tmpfs:
      - /var/lib/postgresql/data
